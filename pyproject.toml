[build-system]
requires = ["setuptools>=43.0.0", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipsw-storage"
dynamic = ["version"]
description = "CLI utilities for listing and downloading Apple IPSW firmware."
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
authors = [
    { name = "ipsw-storage contributors" },
]
keywords = ["apple", "firmware", "ipsw", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.6",
    "setuptools>=43.0.0",
    "setuptools_scm>=8",
    "wheel",
]

[project.scripts]
ipsw-storage = "ipsw_storage.cli:cli"

[tool.setuptools.packages.find]
include = ["ipsw_storage*"]
exclude = ["docs*", "tests*"]

[tool.setuptools.dynamic]
version = { attr = "ipsw_storage._version.__version__" }

[tool.setuptools_scm]
version_file = "ipsw_storage/_version.py"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
